[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "object-profiling"
version = "0.1.0"
description = "Suspended cuboid measurement with a UR10e in MuJoCo"
requires-python = ">=3.11"
dependencies = [
  "mujoco==3.13.0",
  "numpy==2.4.6",
  "opencv-python==4.14.0.94",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
object-profiling-checkpoint = "object_profiling.evaluation.checkpoint:main"
object-profiling-profile = "object_profiling.station.pipeline:main"
object-profiling-demo = "object_profiling.presentation.demo:main"
object-profiling-showcase = "object_profiling.presentation.showcase:main"
object-profiling-camera-audit = "object_profiling.evaluation.audits.camera:main"
object-profiling-depth-audit = "object_profiling.evaluation.audits.depth:main"
object-profiling-segmentation-audit = "object_profiling.evaluation.audits.segmentation:main"
object-profiling-registration-audit = "object_profiling.evaluation.audits.registration:main"
object-profiling-geometry-audit = "object_profiling.evaluation.audits.geometry:main"
object-profiling-benchmark = "object_profiling.evaluation.benchmark:main"
object-profiling-pose-ablation = "object_profiling.evaluation.pose_ablation:main"
object-profiling-damage-audit = "object_profiling.evaluation.audits.damage:main"
object-profiling-inspection-audit = "object_profiling.evaluation.audits.inspect:main"
object-profiling-discard-audit = "object_profiling.evaluation.audits.discard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
