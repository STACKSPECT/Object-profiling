[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "object-profiling"
version = "0.1.0"
description = "Suspended cuboid measurement with a UR10e in MuJoCo"
requires-python = ">=3.11"
dependencies = [
  "mujoco==3.13.0",
  "numpy==2.4.6",
  "opencv-python==4.14.0.94",
  "open3d==0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
object-profiling-checkpoint = "object_profiling.checkpoint:main"
object-profiling-profile = "object_profiling.profiling_pipeline:main"
object-profiling-demo = "object_profiling.demo:main"
object-profiling-camera-audit = "object_profiling.camera_audit:main"
object-profiling-depth-audit = "object_profiling.depth_audit:main"
object-profiling-segmentation-audit = "object_profiling.segmentation_audit:main"
object-profiling-registration-audit = "object_profiling.registration_audit:main"
object-profiling-geometry-audit = "object_profiling.geometry_audit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
