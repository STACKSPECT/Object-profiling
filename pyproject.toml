[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "object-profiling"
version = "0.1.0"
description = "Measure a held rectangular box and inspect structural damage from RGB-D"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "opencv-python==4.14.0.94",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
